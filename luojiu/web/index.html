<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>洛玖 · 群聊中的成长</title>
<style>
:root{--bg:#0c111b;--panel:#151d2c;--panel2:#1c2738;--line:#2b3a50;--text:#eaf0f7;--muted:#91a0b7;--accent:#9b8cff;--human:#243349;--bot:#302d54;--good:#76d7ad;--warn:#f3be73;--danger:#f18b9d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% 0,#1c2440 0,#0c111b 44%);color:var(--text);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft Yahei",sans-serif;height:100vh}button,input,textarea{font:inherit}button{cursor:pointer;border:0;color:var(--text);background:var(--panel2);padding:9px 13px;border-radius:9px}button:hover{filter:brightness(1.18)}button.primary{background:var(--accent);color:#161329;font-weight:650}button.ghost{background:transparent;border:1px solid var(--line)}button.danger{color:var(--danger)}input,textarea{background:#0e1521;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;outline:0}input:focus,textarea:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:46px}.hidden{display:none!important}.shell{height:100vh;display:flex}.auth{width:min(430px,calc(100% - 32px));margin:auto;background:rgba(21,29,44,.9);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 20px 70px #0008}.logo{display:flex;gap:12px;align-items:center;margin-bottom:24px}.avatar{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#9b8cff,#62d9ce);color:#121725;font-size:22px;font-weight:800}.logo h1{margin:0;font-size:22px}.sub{color:var(--muted);font-size:12px}.form{display:grid;gap:12px}.form label{display:grid;gap:5px;color:var(--muted);font-size:12px}.switch{margin-top:16px;text-align:center;color:var(--muted)}.switch a{color:#c2baff;cursor:pointer}.error{min-height:20px;color:var(--danger);font-size:12px}.sidebar{width:270px;background:rgba(12,17,27,.8);border-right:1px solid var(--line);display:flex;flex-direction:column}.sidehead{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.sidehead b{font-size:17px}.groups{padding:12px;overflow:auto;flex:1}.group{padding:11px;border-radius:11px;margin-bottom:4px;color:var(--muted);cursor:pointer}.group:hover,.group.active{background:var(--panel2);color:var(--text)}.group small{display:block;opacity:.65;margin-top:2px}.sidefoot{padding:13px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#111927aa}.topbar h2{font-size:16px;margin:0}.online{color:var(--good);font-size:12px}.chat{flex:1;overflow:auto;padding:22px clamp(14px,5vw,70px);display:flex;flex-direction:column;gap:12px}.notice{text-align:center;color:var(--muted);font-size:12px;margin:8px 0}.msg{max-width:min(730px,86%);display:flex;gap:9px;align-items:flex-start}.msg.mine{margin-left:auto;flex-direction:row-reverse}.msg .bubble{background:var(--human);padding:10px 13px;border-radius:13px 13px 13px 4px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.mine .bubble{background:#264a52;border-radius:13px 13px 4px 13px}.msg.bot .bubble{background:var(--bot);border:1px solid #58519a;border-radius:13px 13px 13px 4px}.msg .meta{font-size:11px;color:var(--muted);margin:2px 5px 4px}.msg .tools{opacity:0;transition:.2s;font-size:11px;margin-top:4px}.msg:hover .tools{opacity:1}.tools button{padding:2px 5px;background:transparent;color:var(--muted)}.composer{padding:12px clamp(14px,5vw,70px) 18px;background:#111927;border-top:1px solid var(--line)}.compose-row{display:flex;gap:9px;align-items:flex-end}.compose-row textarea{flex:1}.hint{font-size:11px;color:var(--muted);margin-top:5px}.right{width:310px;border-left:1px solid var(--line);background:rgba(21,29,44,.68);overflow:auto;padding:18px}.card{background:#121a28;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}.card h3{font-size:13px;margin:0 0 10px}.stat{display:flex;justify-content:space-between;margin:6px 0;color:var(--muted)}.stat b{color:var(--text)}.stage{color:var(--accent);font-weight:650;font-size:18px}.review{padding:8px 0;border-top:1px solid #263246}.review:first-of-type{border-top:0}.review q{display:block;color:var(--muted);margin-bottom:6px}.review .answer{margin-bottom:7px}.split{display:flex;gap:6px}.split>*{flex:1}.tiny{font-size:11px;color:var(--muted)}@media(max-width:950px){.right{display:none}}@media(max-width:650px){.sidebar{width:64px}.sidehead{padding:14px 9px}.sidehead b,.sidehead button,.group small,.sidefoot{display:none}.group{font-size:0;text-align:center;padding:14px 4px}.group:before{content:'群';font-size:13px;color:var(--accent)}.chat{padding:15px 10px}.composer{padding:9px}.topbar{padding:0 12px}}
</style></head>
<body>
<section id="auth" class="auth"><div class="logo"><div class="avatar">玖</div><div><h1>洛玖</h1><div class="sub">一个会在群聊里慢慢长大的成员</div></div></div>
<div id="loginForm" class="form"><label>用户 ID<input id="loginId" autocomplete="username" placeholder="例如 alice"></label><label>密码<input id="loginPassword" type="password" autocomplete="current-password"></label><button class="primary" onclick="login()">进入群聊</button></div>
<div id="registerForm" class="form hidden"><label>用户 ID<input id="regId" placeholder="2–40 位英文、数字、_ 或 -"></label><label>昵称<input id="regName" placeholder="群里显示的名字"></label><label>密码<input id="regPassword" type="password" placeholder="至少 8 位"></label><button class="primary" onclick="register()">创建身份</button></div><div id="authError" class="error"></div><div class="switch"><span id="switchText">还没有身份？</span> <a onclick="toggleAuth()" id="switchAction">注册</a></div></section>
<section id="app" class="shell hidden"><aside class="sidebar"><div class="sidehead"><b>群聊</b><button onclick="createGroup()">＋</button></div><div id="groups" class="groups"></div><div class="sidefoot"><span id="me"></span><br><button class="ghost" onclick="logout()">退出</button></div></aside><main class="main"><header class="topbar"><div><h2 id="groupName">选择一个群</h2><span id="online" class="online"></span></div><div><button class="ghost" onclick="teach()">教她</button> <button class="ghost" onclick="createDm()">私聊</button> <button class="ghost" onclick="joinGroup()">加入群</button> <button class="ghost" onclick="showInvite()">群设置</button></div></header><div id="chat" class="chat"><div class="notice">洛玖会观察群里的对话，决定什么时候加入。你也可以直接 @洛玖。</div></div><div class="composer"><div class="compose-row"><textarea id="message" rows="1" placeholder="说点什么… 直接 @洛玖 会叫醒她" onkeydown="keySend(event)"></textarea><button class="primary" onclick="sendMessage()">发送</button></div><div class="hint">群聊中的人类对话会成为她观察到的经历；只有群主确认后，示范才会成为共享的学习材料。</div></div></main><aside class="right"><div class="card"><h3>她现在的状态</h3><div id="stage" class="stage">初见</div><div id="stateText" class="tiny">她还没有形成自己的经历。</div><div class="stat"><span>已确认经历</span><b id="activeCount">0</b></div><div class="stat"><span>待确认示范</span><b id="pendingCount">0</b></div><div class="stat"><span>模型更新</span><b id="updates">0</b></div></div><div class="card"><h3>待她学习的示范</h3><div id="reviews" class="tiny">暂无待确认内容</div></div><div class="card"><h3>她记住的人</h3><div id="facts" class="tiny">还没有个人记忆</div></div><div class="card"><h3>发生过的事</h3><div id="events" class="tiny"></div></div></aside></section>
<script>
let token=localStorage.getItem('luojiu_token')||'', me=null, current=null, timer=null, last=0, authLogin=true;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){opts.headers={'Content-Type':'application/json',...(opts.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(path,opts),j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}
function toggleAuth(){authLogin=!authLogin;$('loginForm').classList.toggle('hidden',!authLogin);$('registerForm').classList.toggle('hidden',authLogin);$('switchText').textContent=authLogin?'还没有身份？':'已经有身份？';$('switchAction').textContent=authLogin?'注册':'登录';$('authError').textContent=''}
async function login(){try{let j=await api('/api/login',{method:'POST',body:JSON.stringify({id:$('loginId').value,password:$('loginPassword').value})});start(j)}catch(e){$('authError').textContent=e.message}}
async function register(){try{let j=await api('/api/register',{method:'POST',body:JSON.stringify({id:$('regId').value,name:$('regName').value,password:$('regPassword').value})});start(j)}catch(e){$('authError').textContent=e.message}}
function start(j){token=j.token;me=j.user;localStorage.setItem('luojiu_token',token);localStorage.setItem('luojiu_user',JSON.stringify(me));$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('me').textContent=me.name+' · '+me.id;loadGroups()}
async function logout(){try{await api('/api/logout',{method:'POST',body:'{}'})}catch{}localStorage.removeItem('luojiu_token');location.reload()}
async function loadGroups(){let gs=await api('/api/groups');$('groups').innerHTML=gs.map(g=>`<div class="group ${current===g.id?'active':''}" onclick="selectGroup('${g.id}')">${esc(g.name)}<small>${g.owner===me.id?'群主':'成员'}</small></div>`).join('');if(!current&&gs[0])selectGroup(gs[0].id);else if(!gs.length)createGroup(true)}
async function createGroup(first=false){let name=prompt('群名称',first?'我们的小宇宙':'新的群聊');if(!name)return;try{let g=await api('/api/groups/create',{method:'POST',body:JSON.stringify({name})});await loadGroups();selectGroup(g.id)}catch(e){alert(e.message)}}
async function createDm(){let target=prompt('对方用户 ID');if(!target)return;try{let g=await api('/api/dm',{method:'POST',body:JSON.stringify({target})});await loadGroups();selectGroup(g.id)}catch(e){alert(e.message)}}
async function joinGroup(){let invite=prompt('粘贴群主分享的邀请码');if(!invite)return;try{let g=await api('/api/groups/join',{method:'POST',body:JSON.stringify({invite})});await loadGroups();selectGroup(g.id)}catch(e){alert(e.message)}}
async function selectGroup(id){current=id;last=0;await loadGroups();$('groupName').textContent='加载中…';$('chat').innerHTML='<div class="notice">她正在回忆这个群的经历…</div>';await refresh();clearInterval(timer);timer=setInterval(refresh,2500)}
async function refresh(){if(!current)return;try{let ms=await api('/api/messages?group='+encodeURIComponent(current)+'&after='+last);if(ms.length){ms.forEach(render);last=ms[ms.length-1].id;scrollChat()}let s=await api('/api/snapshot?group='+encodeURIComponent(current));renderSnapshot(s)}catch(e){if(e.message.includes('登录'))location.reload()}}
function render(m){if($('chat').querySelector('.notice'))$('chat').innerHTML='';let mine=m.user_id===me.id,bot=m.user_id==='luojiu';let el=document.createElement('div');el.className='msg '+(mine?'mine ':'')+(bot?'bot':'');let buttons=bot?`<div class="tools"><button onclick="feedback(${m.id},1)">有帮助</button><button onclick="feedback(${m.id},-1)">不对</button><button onclick="correct(${m.id})">纠正</button></div>`:'';el.innerHTML=`<div class="avatar">${bot?'玖':esc((m.name||'?')[0])}</div><div><div class="meta">${esc(m.name)} · ${new Date(m.created*1000).toLocaleTimeString()}${bot&&m.kind==='social'?' · 自己决定加入':''}</div><div class="bubble">${esc(m.text)}</div>${buttons}</div>`;$('chat').appendChild(el)}
function scrollChat(){$('chat').scrollTop=$('chat').scrollHeight}

async function sendMessage(){let text=$('message').value.trim();if(!text||!current)return;$('message').value='';try{let j=await api('/api/send',{method:'POST',body:JSON.stringify({group:current,text})});await refresh();scrollChat()}catch(e){alert(e.message)}}
function keySend(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
async function feedback(id,value){try{await api('/api/feedback',{method:'POST',body:JSON.stringify({group:current,message_id:id,value})});await refresh()}catch(e){alert(e.message)}}
async function correct(id){let answer=prompt('你认为洛玖应该怎么回答？');if(!answer)return;try{await api('/api/feedback',{method:'POST',body:JSON.stringify({group:current,message_id:id,value:-1,correction:answer})});await refresh()}catch(e){alert(e.message)}}
async function teach(){let q=prompt('给她一个问题或场景');if(!q)return;let a=prompt('在这个场景下，你希望她怎么说？');if(!a)return;try{await api('/api/teach',{method:'POST',body:JSON.stringify({group:current,question:q,answer:a})});await refresh()}catch(e){alert(e.message)}}
function renderSnapshot(s){$('groupName').textContent=s.group.name;$('stage').textContent=s.stage;$('stateText').textContent=`她和 ${s.members.length} 位成员一起生活过，已积累 ${s.updates} 次内部更新。`;$('activeCount').textContent=s.counts.active||0;$('pendingCount').textContent=s.counts.pending||0;$('updates').textContent=s.updates||0;$('reviews').innerHTML=(s.group.owner===me.id?(s.examples||[]).filter(x=>x.status==='pending').map(x=>`<div class="review"><q>${esc(x.question)}</q><div class="answer">${esc(x.answer)}</div><div class="split"><button onclick="review(${x.id},true)">确认学会</button><button class="danger" onclick="review(${x.id},false)">忽略</button></div></div>`).join(''):'只有群主可以确认共享学习材料。')||'暂无待确认内容';$('facts').innerHTML=(s.facts||[]).map(f=>`<div class="review">${esc(f.name)}：${esc(f.value)} <button onclick="forgetFact(${f.id})">忘掉</button></div>`).join('')||'还没有个人记忆';$('events').innerHTML=(s.events||[]).slice(0,8).map(e=>`<div class="review">${esc(e.detail)}</div>`).join('')||'她还在观察。'}
async function review(id,approve){try{await api('/api/review',{method:'POST',body:JSON.stringify({group:current,example_id:id,approve})});await refresh()}catch(e){alert(e.message)}}
async function forgetFact(id){try{await api('/api/fact/forget',{method:'POST',body:JSON.stringify({group:current,fact_id:id})});await refresh()}catch(e){alert(e.message)}}
async function showInvite(){try{let s=await api('/api/snapshot?group='+encodeURIComponent(current));if(s.group.owner!==me.id)return alert('只有群主可以管理群设置');let j=await api('/api/groups/invite',{method:'POST',body:JSON.stringify({group:current})});alert('把这个邀请码发给群友：\n'+j.invite)}catch(e){alert(e.message)}}
if(token){try{me=JSON.parse(localStorage.getItem('luojiu_user')||'null')}catch{};if(me)api('/api/groups').then(()=>start({token,user:me})).catch(()=>{localStorage.removeItem('luojiu_token');localStorage.removeItem('luojiu_user')})}
</script></body></html>
