<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洛玖 · 教学后台</title><style>
body{margin:0;background:#0c111b;color:#eaf0f7;font:14px system-ui,"Microsoft Yahei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2b3a50;padding-bottom:14px}.bar a{color:#a99cff}.select{margin:20px 0;display:flex;gap:8px;flex-wrap:wrap}select,input,textarea,button{font:inherit;border-radius:8px;border:1px solid #2b3a50;background:#151d2c;color:#eaf0f7;padding:9px}button{cursor:pointer}button.ok{background:#6dd4aa;color:#102219}button.no{color:#f299aa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{background:#151d2c;border:1px solid #2b3a50;border-radius:12px;padding:14px}.card h3{font-size:14px;margin:0 0 9px}.muted{color:#91a0b7;font-size:12px}.question{color:#d9d2ff;margin:7px 0}.answer{padding:9px;background:#101722;border-radius:8px;white-space:pre-wrap}.why{color:#91a0b7;font-size:12px;margin-top:8px}.actions{display:flex;gap:7px;margin-top:10px}.wide{grid-column:1/-1}.error{color:#f299aa}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="bar"><div><b>洛玖 · 教学后台</b><div class="muted">她当时看见了什么、做了什么判断、你怎样纠正她</div></div><a href="/">回到群聊</a></div><div class="select"><select id="group"></select><button onclick="load()">刷新</button><button onclick="teach()">新增示范</button><span id="error" class="error"></span></div><div id="stats" class="card muted">请选择群聊。</div><div id="items" class="grid"></div></div><script>
let token=localStorage.getItem('luojiu_token')||'',user=JSON.parse(localStorage.getItem('luojiu_user')||'null'),current='';const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){o.headers={'Content-Type':'application/json',...(o.headers||{}),Authorization:'Bearer '+token};let r=await fetch(p,o),j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}async function init(){try{let gs=await api('/api/groups');$('group').innerHTML=gs.map(g=>`<option value="${g.id}">${esc(g.name)} · ${g.owner===user.id?'群主':'成员'}</option>`).join('');current=gs[0]?.id||'';$('group').onchange=()=>{current=$('group').value;load()};if(current)load()}catch(e){$('error').textContent=e.message}}async function load(){if(!current)return;try{let s=await api('/api/snapshot?group='+encodeURIComponent(current));$('stats').textContent=`阶段：${s.stage}　脑子：${s.brain.type}　局部节点：${s.brain.nodes}　脉冲事件：${s.brain.events}　待确认：${s.counts.pending||0}`;let rows=s.examples||[];$('items').innerHTML=rows.map(x=>`<article class="card"><div class="muted">样本 #${x.id} · ${esc(x.status)} · 来源 ${esc(x.source)}</div><div class="question">她当时遇到：${esc(x.question)}</div><div class="answer">她当时回答：${esc(x.answer)}</div><div class="why">这条样本会影响她的局部节点与结构连接；即时回答的依据会显示在群聊消息的详情里。</div>${x.status==='pending'&&s.group.owner===user.id?`<div class="actions"><button class="ok" onclick="review(${x.id},true)">对：让她学会</button><button class="no" onclick="review(${x.id},false)">错：不要学</button><button onclick="correct(${x.id})">应该这样回</button></div>`:''}</article>`).join('')||'<div class="card muted wide">还没有教学样本。她会先在群里观察，主人再从这里一点点教她。</div>'}catch(e){$('error').textContent=e.message}}async function review(id,a){try{await api('/api/review',{method:'POST',body:JSON.stringify({group:current,example_id:id,approve:a})});load()}catch(e){alert(e.message)}}async function correct(id){let a=prompt('应该这样回：');if(!a)return;try{let s=await api('/api/snapshot?group='+encodeURIComponent(current));let x=s.examples.find(e=>e.id===id);await api('/api/review',{method:'POST',body:JSON.stringify({group:current,example_id:id,approve:false})});await api('/api/teach',{method:'POST',body:JSON.stringify({group:current,question:x.question,answer:a})});load()}catch(e){alert(e.message)}}async function teach(){let q=prompt('她遇到的输入或场景');if(!q)return;let a=prompt('应该怎样回应');if(!a)return;try{await api('/api/teach',{method:'POST',body:JSON.stringify({group:current,question:q,answer:a})});load()}catch(e){alert(e.message)}}if(token&&user)init();else location.href='/';
</script></body></html>
